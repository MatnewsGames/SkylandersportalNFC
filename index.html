<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skylanders Portal - WebNFC</title>
    <style>
        :root {
            --bg-color: #0b0c10;
            --card-bg: #1f2833;
            --primary: #8a2be2;
            --accent-green: #00ff66;
            --text-color: #c5c6c7;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle at center, #1a0033 0%, var(--bg-color) 70%);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: rgba(31, 40, 51, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(138, 43, 226, 0.3);
            border-radius: 20px;
            padding: 30px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8);
            text-align: center;
        }

        h1 {
            font-size: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #fff;
            margin-bottom: 20px;
            text-shadow: 0 0 10px var(--primary);
        }

        /* Animação do Portal */
        .portal-ring {
            width: 180px;
            height: 180px;
            margin: 20px auto;
            border-radius: 50%;
            border: 4px dashed var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: 0 0 20px rgba(138, 43, 226, 0.4);
            animation: rotatePortal 12s linear infinite;
            transition: all 0.4s ease;
        }

        @keyframes rotatePortal {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .portal-inner {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(138,43,226,0.2) 0%, rgba(0,0,0,0.8) 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            animation: pulsePortal 2s ease-in-out infinite alternate;
        }

        @keyframes pulsePortal {
            from { box-shadow: inset 0 0 10px var(--primary); }
            to { box-shadow: inset 0 0 25px var(--primary); }
        }

        /* Portal Ativo */
        .portal-ring.active {
            border-style: solid;
            animation: none;
        }

        .ip-input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.5);
            color: #fff;
            font-size: 0.9rem;
            margin-bottom: 15px;
            text-align: center;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #8a2be2, #4a00e0);
            color: #fff;
            font-weight: bold;
            font-size: 1rem;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(138, 43, 226, 0.4);
            transition: transform 0.2s, box-shadow 0.2s, background 0.3s;
        }

        .btn:active { transform: scale(0.98); }

        .card-info {
            margin-top: 15px;
            padding: 12px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .sky-nome {
            font-size: 1.2rem;
            font-weight: bold;
            color: #fff;
        }

        .sky-tipo {
            font-size: 0.9rem;
            color: #aaa;
            margin-top: 4px;
        }

        .status-badge {
            margin-top: 12px;
            font-size: 0.8rem;
            color: #777;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Portal of Power</h1>

        <input type="text" id="ipInput" class="ip-input" placeholder="IP do PC (ex: 192.168.1.15:5000)" value="192.168.1.15:5000">

        <div class="portal-ring" id="portalRing">
            <div class="portal-inner">
                <span id="portalIcon" style="font-size: 2.8rem;">🔮</span>
            </div>
        </div>

        <button id="btnAtivar" class="btn">Ativar Portal NFC</button>

        <div class="card-info">
            <div class="sky-nome" id="skyNome">Portal Vazio</div>
            <div class="sky-tipo" id="skyTipo">Aproxime um Skylander no celular</div>
        </div>

        <div class="status-badge" id="status">Aguardando ativação...</div>
    </div>

    <script>
        // --- BANCO DE DADOS DE SKYLANDERS ---
        // Adicione seus bonecos aqui relacionando o UID (em letras minúsculas)
        const skylandersDB = {
            "14:22:3b:14": { nome: "Spyro", elemento: "Magia 🔮", cor: "#8a2be2", icone: "🐉" },
            // Exemplos adicionais que você pode alterar depois:
            "04:11:22:33:44:55:66": { nome: "Gill Grunt", elemento: "Água 🌊", cor: "#00aaff", icone: "🐟" },
            "04:aa:bb:cc:dd:ee:ff": { nome: "Trigger Happy", elemento: "Tech ⚙️", cor: "#ff9900", icone: "🔫" }
        };

        const btnAtivar = document.getElementById('btnAtivar');
        const statusDiv = document.getElementById('status');
        const skyNome = document.getElementById('skyNome');
        const skyTipo = document.getElementById('skyTipo');
        const portalRing = document.getElementById('portalRing');
        const portalIcon = document.getElementById('portalIcon');
        const ipInput = document.getElementById('ipInput');

        let currentUID = null;

        btnAtivar.addEventListener('click', async () => {
            if (btnAtivar.innerText === "REMOVER DO PORTAL") {
                limparPortal();
                return;
            }

            if (!('NDEFReader' in window)) {
                statusDiv.innerText = "Web NFC não suportado no navegador (Use Chrome Android).";
                return;
            }

            try {
                const ndef = new NDEFReader();
                await ndef.scan();
                
                statusDiv.innerText = "Portal Online! Aproxime o Skylander.";
                
                btnAtivar.innerText = "REMOVER DO PORTAL";
                btnAtivar.style.background = "linear-gradient(135deg, #ff0055, #990033)";
                btnAtivar.style.boxShadow = "0 4px 15px rgba(255, 0, 85, 0.4)";
                ipInput.style.display = 'none';

                ndef.addEventListener("reading", ({ serialNumber }) => {
                    if (!serialNumber) return;
                    const uidLido = serialNumber.toLowerCase();

                    if (currentUID === uidLido) {
                        limparPortal();
                    } else {
                        ativarSkylander(uidLido);
                    }
                });

            } catch (error) {
                statusDiv.innerText = `Erro ao acessar NFC: ${error.message || error}`;
            }
        });

        function ativarSkylander(uid) {
            currentUID = uid;
            const serverHost = ipInput.value.trim();

            // Busca no banco de dados pelo UID lido
            const skylander = skylandersDB[uid] || {
                nome: "Skylander Desconhecido",
                elemento: "Elemento Desconhecido",
                cor: "#00ff66",
                icone: "⚡"
            };

            // Atualiza a tela com as informações do personagem
            skyNome.innerText = skylander.nome;
            skyTipo.innerText = skylander.elemento;
            portalIcon.innerText = skylander.icone;
            
            portalRing.classList.add('active');
            portalRing.style.borderColor = skylander.cor;
            portalRing.style.boxShadow = `0 0 35px ${skylander.cor}`;

            statusDiv.innerText = `Ativo | UID: ${uid}`;

            enviarParaPC(serverHost, uid, "presente", skylander.nome);
        }

        function limparPortal() {
            if (!currentUID) return;
            const serverHost = ipInput.value.trim();

            skyNome.innerText = "Portal Vazio";
            skyTipo.innerText = "Aproxime um Skylander no celular";
            portalIcon.innerText = "🔮";

            portalRing.classList.remove('active');
            portalRing.style.borderColor = "";
            portalRing.style.boxShadow = "";

            statusDiv.innerText = "Aguardando novo Skylander...";
            
            enviarParaPC(serverHost, currentUID, "removido", "");
            currentUID = null;
        }

        function enviarParaPC(host, uid, status, nome) {
            let urlBase = host.startsWith('http') ? host : `http://${host}`;
            const url = `${urlBase}/scan?uid=${uid}&status=${status}&nome=${encodeURIComponent(nome)}`;

            fetch(url, { method: 'POST' })
                .catch(() => statusDiv.innerText = "Erro ao conectar com o PC!");
        }
    </script>
</body>
</html>
