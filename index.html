<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skylanders Portal of Power</title>
    <style>
        :root {
            --bg-color: #0b0c10;
            --card-bg: rgba(31, 40, 51, 0.75);
            --primary-glow: #8a2be2;
            --text-main: #ffffff;
            --text-sub: #c5c6c7;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: radial-gradient(circle at center, #1f003b 0%, var(--bg-color) 80%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(138, 43, 226, 0.35);
            border-radius: 24px;
            padding: 28px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.85);
            text-align: center;
        }

        h1 {
            font-size: 1.4rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #fff;
            margin-bottom: 18px;
            text-shadow: 0 0 12px var(--primary-glow);
        }

        /* Anel Mágico do Portal */
        .portal-ring {
            width: 170px;
            height: 170px;
            margin: 20px auto;
            border-radius: 50%;
            border: 4px dashed var(--primary-glow);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 25px rgba(138, 43, 226, 0.4);
            animation: girarPortal 12s linear infinite;
            transition: border 0.4s ease, box-shadow 0.4s ease;
        }

        @keyframes girarPortal {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .portal-inner {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(138, 43, 226, 0.25) 0%, rgba(0,0,0,0.85) 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: background 0.4s ease;
        }

        .portal-ring.active {
            animation: pulseAura 1.5s ease-in-out infinite alternate;
            border-style: solid;
        }

        @keyframes pulseAura {
            from { transform: scale(1); }
            to { transform: scale(1.03); }
        }

        /* Inputs e Botões */
        .ip-input {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            font-size: 0.95rem;
            margin-bottom: 16px;
            text-align: center;
            outline: none;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #8a2be2, #4a00e0);
            color: #fff;
            font-weight: bold;
            font-size: 1rem;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(138, 43, 226, 0.4);
        }

        .btn:active { transform: scale(0.98); }

        /* Painel de Info do Skylander */
        .info-card {
            margin-top: 15px;
            padding: 12px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 12px;
            min-height: 85px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 4px;
        }

        .sky-nome {
            font-size: 1.2rem;
            font-weight: bold;
            color: #fff;
        }

        .sky-detalhes {
            font-size: 0.85rem;
            color: var(--text-sub);
        }

        .status-text {
            margin-top: 12px;
            font-size: 0.8rem;
            color: #888;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Portal of Power</h1>

        <input type="text" id="ipInput" class="ip-input" placeholder="IP do PC (ex: 192.168.1.15:5000)" value="192.168.1.15:5000">

        <div class="portal-ring" id="portalRing">
            <div class="portal-inner">
                <span id="portalIcon" style="font-size: 2.8rem;">🔮</span>
            </div>
        </div>

        <button id="btnAtivar" class="btn">Ativar Portal NFC</button>

        <div class="info-card">
            <div class="sky-nome" id="skyNome">Portal Vazio</div>
            <div class="sky-detalhes" id="skyDetalhes">Aproxime um Skylander para ler</div>
        </div>

        <div class="status-text" id="status">Aguardando ativação...</div>
    </div>

    <script>
        const btnAtivar = document.getElementById('btnAtivar');
        const statusDiv = document.getElementById('status');
        const skyNome = document.getElementById('skyNome');
        const skyDetalhes = document.getElementById('skyDetalhes');
        const portalRing = document.getElementById('portalRing');
        const portalIcon = document.getElementById('portalIcon');
        const ipInput = document.getElementById('ipInput');

        let currentUID = null;
        let lastSeenTime = 0;
        let pollTimer = null;

        btnAtivar.addEventListener('click', async () => {
            if (!('NDEFReader' in window)) {
                statusDiv.innerText = "Web NFC não suportado no navegador (Use Chrome Android).";
                return;
            }

            try {
                const ndef = new NDEFReader();
                await ndef.scan();
                
                statusDiv.innerText = "Portal Ativo! Encoste o Skylander no celular.";
                btnAtivar.style.display = 'none';
                ipInput.style.display = 'none';

                ndef.addEventListener("reading", ({ serialNumber }) => {
                    currentUID = serialNumber;
                    lastSeenTime = Date.now();
                });

                // Polling a cada 0.5 segundos (500ms)
                pollTimer = setInterval(verificarEstadoNFC, 500);

            } catch (error) {
                statusDiv.innerText = `Erro ao acessar NFC: ${error}`;
            }
        });

        function verificarEstadoNFC() {
            const agora = Date.now();
            const serverHost = ipInput.value.trim();

            // Se lido nos últimos 1.2 segundos -> Presente
            if (currentUID && (agora - lastSeenTime < 1200)) {
                enviarParaPC(serverHost, currentUID, "presente");
            } 
            // Passou mais de 1.2s -> Removido
            else if (currentUID) {
                enviarParaPC(serverHost, currentUID, "removido");
                currentUID = null;
            }
        }

        function enviarParaPC(host, uid, status) {
            const url = `http://${host}/server.php?uid=${uid}&status=${status}`;

            fetch(url, { method: 'POST' })
                .then(res => res.json())
                .then(data => {
                    if (status === 'presente' && data.skylander) {
                        const sky = data.skylander;
                        
                        // Atualiza a interface
                        skyNome.innerText = sky.nome;
                        skyDetalhes.innerText = `${sky.elemento} • ${sky.tipo}`;
                        
                        // Aplica a cor do elemento do Skylander no portal
                        portalRing.classList.add('active');
                        portalRing.style.borderColor = sky.cor;
                        portalRing.style.boxShadow = `0 0 35px ${sky.cor}`;
                        portalIcon.innerText = "⚡";
                        statusDiv.innerText = `UID: ${uid}`;
                    } else if (status === 'removido') {
                        // Reseta a interface
                        skyNome.innerText = "Portal Vazio";
                        skyDetalhes.innerText = "Aproxime um Skylander para ler";
                        
                        portalRing.classList.remove('active');
                        portalRing.style.borderColor = "";
                        portalRing.style.boxShadow = "";
                        portalIcon.innerText = "🔮";
                        statusDiv.innerText = "Aguardando novo Skylander...";
                    }
                })
                .catch(() => {
                    statusDiv.innerText = "Erro ao conectar com o server.php local!";
                });
        }
    </script>
</body>
</html>
